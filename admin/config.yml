backend:
  name: github
  repo: trustcorretoraseg-blip/piemonte-brokers-site
  branch: main

locale: "pt"

media_folder: "uploads"
public_folder: "/uploads"

collections:

  - name: "site"
    label: "Configurações do site"
    files:

      - name: "configuracoes"
        label: "Configurações gerais"
        file: "data/site.json"
        format: "json"

        fields:

          - label: "Nome da empresa"
            name: "nome"
            widget: "string"

          - label: "Título da Home"
            name: "tituloHome"
            widget: "string"

          - label: "Subtítulo da Home"
            name: "subtituloHome"
            widget: "text"

          - label: "Imagem principal da Home"
            name: "imagemHome"
            widget: "image"

          - label: "Texto Sobre"
            name: "textoSobre"
            widget: "text"

          - label: "WhatsApp"
            name: "whatsapp"
            widget: "string"
            required: false

          - label: "E-mail"
            name: "email"
            widget: "string"
            required: false

          - label: "Instagram"
            name: "instagram"
            widget: "string"
            required: false

          - label: "Cidade base"
            name: "cidadeBase"
            widget: "string"
            required: false

          - label: "CRECI da empresa"
            name: "creciEmpresa"
            widget: "string"
            required: false


  - name: "regioes"
    label: "Regiões"
    files:

      - name: "regioes"
        label: "Regiões de atuação"
        file: "data/regioes.json"
        format: "json"

        fields:

          - label: "Regiões"
            name: "itens"
            widget: "list"
            summary: "{{fields.nome}}"

            fields:

              - label: "ID"
                name: "id"
                widget: "string"

              - label: "Nome"
                name: "nome"
                widget: "string"

              - label: "Descrição"
                name: "descricao"
                widget: "text"
                required: false

              - label: "Descrição completa"
                name: "descricaoLonga"
                widget: "text"
                required: false
                hint: "Texto completo exibido na página da propriedade."

              - label: "Acabamentos"
                name: "acabamentos"
                widget: "list"
                required: false
                label_singular: "Acabamento"
                hint: "Adicione somente os acabamentos que este imóvel possui."
                field:
                  label: "Acabamento"
                  name: "item"
                  widget: "string"

              - label: "Ambientes & Interior"
                name: "ambientesInterior"
                widget: "list"
                required: false
                label_singular: "Ambiente / característica"
                hint: "Ex.: Escritório, adega, lareira, home cinema, closet, espaço gourmet."
                field:
                  label: "Item"
                  name: "item"
                  widget: "string"

              - label: "Áreas Externas & Lazer"
                name: "areasExternasLazer"
                widget: "list"
                required: false
                label_singular: "Item de lazer"
                hint: "Ex.: Piscina, piscina aquecida, sauna, spa, jardim, quadra, churrasqueira."
                field:
                  label: "Item"
                  name: "item"
                  widget: "string"

              - label: "Tecnologia, Segurança & Conforto"
                name: "tecnologiaConforto"
                widget: "list"
                required: false
                label_singular: "Item"
                hint: "Ex.: Automação, energia solar, ar-condicionado, CFTV, aquecimento, gerador."
                field:
                  label: "Item"
                  name: "item"
                  widget: "string"

              - label: "Mobília & Eletros"
                name: "mobiliaEletros"
                widget: "list"
                required: false
                label_singular: "Item"
                hint: "Ex.: Mobiliado, marcenaria planejada, eletrodomésticos inclusos."
                field:
                  label: "Item"
                  name: "item"
                  widget: "string"

              - label: "Destaques Piemonte"
                name: "diferenciais"
                widget: "list"
                required: false
                label_singular: "Destaque"
                hint: "Características especiais que merecem destaque nesta propriedade."
                field:
                  label: "Destaque"
                  name: "item"
                  widget: "string"

              - label: "Imagem"
                name: "imagem"
                widget: "image"
                required: false

              - label: "Cidade usada no filtro"
                name: "cidadeFiltro"
                widget: "string"
                required: false

              - label: "Exibir na Home"
                name: "destaque"
                widget: "boolean"
                default: true
                required: false


  - name: "portfolio"
    label: "Portfólio"
    files:

      - name: "portfolio"
        label: "Imóveis e Áreas"
        file: "data/portfolio.json"
        format: "json"

        fields:

          - label: "Itens"
            name: "itens"
            widget: "list"
            summary: "{{fields.titulo}}"

            fields:

              - label: "ID"
                name: "id"
                widget: "string"

              - label: "Categoria"
                name: "categoria"
                widget: "select"
                options:
                  - "Imóvel"
                  - "Área"

              - label: "Status"
                name: "status"
                widget: "select"
                required: false
                options:
                  - "Disponível"
                  - "Reservado"
                  - "Vendido"
                  - "Indisponível"

              - label: "Negócio"
                name: "negocio"
                widget: "select"
                required: false
                options:
                  - "Venda"
                  - "Locação"

              - label: "Título"
                name: "titulo"
                widget: "string"

              - label: "Região principal"
                name: "regiaoPrincipal"
                widget: "string"
                required: false

              - label: "Cidade"
                name: "cidade"
                widget: "string"
                required: false

              - label: "Bairro / Condomínio / Região"
                name: "regiao"
                widget: "string"
                required: false

              - label: "Tipo"
                name: "tipo"
                widget: "string"
                required: false

              - label: "Preço numérico"
                name: "preco"
                widget: "number"
                required: false
                value_type: "float"

              - label: "Preço exibido"
                name: "precoTexto"
                widget: "string"
                required: false
                hint: "Ex.: R$ 4.500.000 ou Consulte"

              - label: "Quartos"
                name: "quartos"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Suítes"
                name: "suites"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Banheiros"
                name: "banheiros"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Vagas"
                name: "vagas"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Área construída (m²)"
                name: "areaConstruida"
                widget: "number"
                required: false
                value_type: "float"

              - label: "Área do terreno (m²)"
                name: "areaTerreno"
                widget: "number"
                required: false
                value_type: "float"

              - label: "Imagem de capa"
                name: "imagemCapa"
                widget: "image"
                required: false

              - label: "Galeria de fotos"
                name: "galeria"
                widget: "list"
                required: false
                summary: "{{fields.foto}}"

                fields:

                  - label: "Foto"
                    name: "foto"
                    widget: "image"

              - label: "Descrição"
                name: "descricao"
                widget: "text"
                required: false

              - label: "Exibir na Seleção Piemonte"
                name: "destaque"
                widget: "boolean"
                default: false
                required: false
                hint: "Ative para exibir este item na Seleção Piemonte da página inicial."

              - label: "Ordem na Seleção Piemonte"
                name: "ordemDestaque"
                widget: "number"
                default: 99
                required: false
                value_type: "int"
                min: 1
                hint: "Use 1 para aparecer primeiro, 2 para aparecer em segundo e assim por diante."