backend:
  name: github
  repo: trustcorretoraseg-blip/piemonte-brokers-site
  branch: main

media_folder: "uploads"
public_folder: "/uploads"


collections:

  # =========================================================
  # CONFIGURAÇÕES DO SITE
  # =========================================================

  - name: "configuracoes"
    label: "Configurações do Site"
    files:

      - name: "site"
        label: "Dados gerais"
        file: "data/site.json"
        format: "json"

        fields:

          - label: "Nome da empresa"
            name: "nome"
            widget: "string"
            default: "Piemonte Brokers"


          - label: "Título principal da Home"
            name: "tituloHome"
            widget: "string"
            required: false


          - label: "Subtítulo principal da Home"
            name: "subtituloHome"
            widget: "text"
            required: false


          - label: "Imagem principal da Home"
            name: "imagemHome"
            widget: "image"
            required: false


          - label: "Texto institucional"
            name: "textoSobre"
            widget: "text"
            required: false


          - label: "WhatsApp"
            name: "whatsapp"
            widget: "string"
            required: false
            hint: "Exemplo: 5511933602204"


          - label: "E-mail"
            name: "email"
            widget: "string"
            required: false


          - label: "Instagram"
            name: "instagram"
            widget: "string"
            required: false
            hint: "Coloque o link completo do Instagram"


          - label: "Cidade base"
            name: "cidadeBase"
            widget: "string"
            required: false


          - label: "CRECI da empresa"
            name: "creciEmpresa"
            widget: "string"
            required: false



  # =========================================================
  # REGIÕES
  # =========================================================

  - name: "regioes"
    label: "Regiões"
    files:

      - name: "lista_regioes"
        label: "Regiões de atuação"
        file: "data/regioes.json"
        format: "json"

        fields:

          - label: "Regiões"
            name: "itens"
            widget: "list"
            summary: "{{fields.nome}}"

            fields:

              - label: "Nome da região"
                name: "nome"
                widget: "string"
                hint: "Exemplo: Itu, Alphaville, Granja Viana"


              - label: "Texto da região"
                name: "descricao"
                widget: "text"
                required: false
                hint: "Texto curto que aparece abaixo da imagem"


              - label: "Imagem da região"
                name: "imagem"
                widget: "image"
                required: false


              - label: "Região usada no filtro"
                name: "cidadeFiltro"
                widget: "string"
                required: false
                hint: "Deve corresponder à Região Principal cadastrada nos imóveis. Exemplo: Itu"


              - label: "Exibir no site"
                name: "destaque"
                widget: "boolean"
                default: true
                required: false



  # =========================================================
  # PORTFÓLIO
  # =========================================================

  - name: "portfolio"
    label: "Portfólio"
    files:

      - name: "lista_portfolio"
        label: "Imóveis e Áreas"
        file: "data/portfolio.json"
        format: "json"

        fields:

          - label: "Imóveis e Áreas"
            name: "itens"
            widget: "list"
            summary: "{{fields.titulo}}"

            fields:

              # -------------------------------------------------
              # IDENTIFICAÇÃO
              # -------------------------------------------------

              - label: "ID"
                name: "id"
                widget: "string"
                hint: "Use um identificador simples, sem espaços. Exemplo: casa-itu-001"


              - label: "Categoria"
                name: "categoria"
                widget: "select"

                options:
                  - "Imóvel"
                  - "Área"


              - label: "Status"
                name: "status"
                widget: "select"
                required: false

                options:
                  - "Disponível"
                  - "Reservado"
                  - "Vendido"
                  - "Locado"
                  - "Indisponível"


              - label: "Finalidade"
                name: "negocio"
                widget: "select"
                required: false

                options:
                  - "Venda"
                  - "Locação"
                  - "Parceria"
                  - "Permuta"


              - label: "Título"
                name: "titulo"
                widget: "string"



              # -------------------------------------------------
              # LOCALIZAÇÃO
              # -------------------------------------------------

              - label: "Região principal"
                name: "regiaoPrincipal"
                widget: "select"
                required: false

                options:
                  - "Itu"
                  - "Porto Feliz"
                  - "Indaiatuba"
                  - "Alphaville"
                  - "Granja Viana"
                  - "Sorocaba"
                  - "Avaré"
                  - "São Paulo"
                  - "Outras regiões"


              - label: "Cidade"
                name: "cidade"
                widget: "string"
                required: false


              - label: "Bairro / Condomínio / Região"
                name: "regiao"
                widget: "string"
                required: false



              # -------------------------------------------------
              # TIPO
              # -------------------------------------------------

              - label: "Tipo"
                name: "tipo"
                widget: "select"
                required: false

                options:

                  - "Casa"
                  - "Casa em condomínio"
                  - "Apartamento"
                  - "Cobertura"
                  - "Terreno"
                  - "Terreno em condomínio"
                  - "Sítio"
                  - "Fazenda"
                  - "Chácara"
                  - "Área"
                  - "Área comercial"
                  - "Área industrial"
                  - "Área logística"
                  - "Área residencial"
                  - "Gleba"
                  - "Loteamento"
                  - "Galpão"
                  - "Prédio comercial"
                  - "Sala comercial"
                  - "Hotel"
                  - "Outro"



              # -------------------------------------------------
              # PREÇO
              # -------------------------------------------------

              - label: "Preço numérico"
                name: "preco"
                widget: "number"
                required: false
                value_type: "float"
                hint: "Exemplo: 3500000"


              - label: "Preço exibido no site"
                name: "precoTexto"
                widget: "string"
                required: false
                hint: "Exemplo: R$ 3.500.000,00 ou Sob consulta"



              # -------------------------------------------------
              # CARACTERÍSTICAS
              # -------------------------------------------------

              - label: "Dormitórios"
                name: "quartos"
                widget: "number"
                required: false
                value_type: "int"


              - label: "Suítes"
                name: "suites"
                widget: "number"
                required: false
                value_type: "int"


              - label: "Banheiros"
                name: "banheiros"
                widget: "number"
                required: false
                value_type: "int"


              - label: "Vagas"
                name: "vagas"
                widget: "number"
                required: false
                value_type: "int"


              - label: "Área construída em m²"
                name: "areaConstruida"
                widget: "number"
                required: false
                value_type: "float"


              - label: "Área do terreno em m²"
                name: "areaTerreno"
                widget: "number"
                required: false
                value_type: "float"



              # -------------------------------------------------
              # CONTEÚDO
              # -------------------------------------------------

              - label: "Descrição"
                name: "descricao"
                widget: "text"
                required: false



              # -------------------------------------------------
              # FOTOS
              # -------------------------------------------------

              - label: "Foto principal"
                name: "imagemCapa"
                widget: "image"
                required: false


              - label: "Galeria de fotos"
                name: "galeria"
                widget: "list"
                required: false

                field:
                  label: "Foto"
                  name: "foto"
                  widget: "image"



              # -------------------------------------------------
              # HOME
              # -------------------------------------------------

              - label: "Exibir na Seleção Piemonte"
                name: "destaque"
                widget: "boolean"
                default: false
                required: false