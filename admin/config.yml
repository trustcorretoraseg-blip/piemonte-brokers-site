backend:
  name: github
  repo: trustcorretoraseg-blip/piemonte-brokers-site
  branch: main

locale: "pt"

media_folder: "uploads"
public_folder: "/uploads"

collections:

  # =========================================================
  # CONFIGURAÇÕES GERAIS
  # =========================================================

  - name: "site"
    label: "Configurações do site"

    files:

      - name: "configuracoes"
        label: "Configurações gerais"
        file: "data/site.json"
        format: "json"

        fields:

          - label: "Nome da empresa"
            name: "nome"
            widget: "string"

          - label: "Título da Home"
            name: "tituloHome"
            widget: "string"

          - label: "Subtítulo da Home"
            name: "subtituloHome"
            widget: "text"

          - label: "Imagem principal da Home"
            name: "imagemHome"
            widget: "image"

          - label: "Texto Sobre"
            name: "textoSobre"
            widget: "text"

          - label: "WhatsApp"
            name: "whatsapp"
            widget: "string"
            required: false

          - label: "E-mail"
            name: "email"
            widget: "string"
            required: false

          - label: "Instagram"
            name: "instagram"
            widget: "string"
            required: false

          - label: "Cidade base"
            name: "cidadeBase"
            widget: "string"
            required: false

          - label: "CRECI da empresa"
            name: "creciEmpresa"
            widget: "string"
            required: false


  # =========================================================
  # REGIÕES
  # =========================================================

  - name: "regioes"
    label: "Regiões"

    files:

      - name: "regioes"
        label: "Regiões de atuação"
        file: "data/regioes.json"
        format: "json"

        fields:

          - label: "Regiões"
            name: "itens"
            widget: "list"
            summary: "{{fields.nome}}"

            fields:

              - label: "ID"
                name: "id"
                widget: "string"
                hint: "Identificador interno. Ex.: itu-regiao"

              - label: "Nome"
                name: "nome"
                widget: "string"

              - label: "Descrição"
                name: "descricao"
                widget: "text"
                required: false

              - label: "Imagem"
                name: "imagem"
                widget: "image"
                required: false

              - label: "Região usada no filtro"
                name: "cidadeFiltro"
                widget: "select"
                required: false

                options:
                  - "Itu & Região"
                  - "Porto Feliz & Região"
                  - "Granja Viana & Alphaville"
                  - "São Paulo"
                  - "Áreas & Oportunidades"
                  - "Granja Viana"
                  - "São Paulo & Alphaville"

              - label: "Exibir na Home"
                name: "destaque"
                widget: "boolean"
                default: true
                required: false


  # =========================================================
  # PORTFÓLIO
  # =========================================================

  - name: "portfolio"
    label: "Portfólio"

    files:

      - name: "portfolio"
        label: "Imóveis e Áreas"
        file: "data/portfolio.json"
        format: "json"

        fields:

          - label: "Itens"
            name: "itens"
            widget: "list"
            summary: "{{fields.codigo}} | {{fields.titulo}}"

            fields:

              # -------------------------------------------------
              # IDENTIFICAÇÃO
              # -------------------------------------------------

              - label: "ID"
                name: "id"
                widget: "string"
                hint: "Use um identificador único. Ex.: casa-palos-verdes"

              - label: "Código Piemonte"
                name: "codigo"
                widget: "string"
                required: false
                hint: "Use sempre o padrão PB 0001, PB 0002, PB 0003..."

              - label: "Categoria"
                name: "categoria"
                widget: "select"

                options:
                  - "Imóvel"
                  - "Área"

              - label: "Status"
                name: "status"
                widget: "select"
                required: false
                default: "Disponível"

                options:
                  - "Disponível"
                  - "Reservado"
                  - "Vendido"
                  - "Indisponível"

              - label: "Publicar no Chaves na Mão?"
                name: "publicarChavesNaMao"
                widget: "select"
                required: false
                default: "Não"
                options:
                  - "Não"
                  - "Sim"
                hint: "Selecione Sim para incluir o imóvel no XML do Chaves na Mão. Não altera a publicação no site Piemonte Brokers."

              - label: "Negócio"
                name: "negocio"
                widget: "select"
                required: false
                default: "Venda"

                options:
                  - "Venda"
                  - "Locação"
                  - "Venda e Locação"

              - label: "Título"
                name: "titulo"
                widget: "string"


              # -------------------------------------------------
              # LOCALIZAÇÃO
              # -------------------------------------------------

              - label: "Região principal"
                name: "regiaoPrincipal"
                widget: "select"
                required: false
                hint: "Escolha a região macro onde este imóvel será exibido."

                options:
                  - "Itu & Região"
                  - "Porto Feliz & Região"
                  - "Granja Viana & Alphaville"
                  - "São Paulo"
                  - "Áreas & Oportunidades"
                  - "Granja Viana"
                  - "São Paulo & Alphaville"

              - label: "Cidade"
                name: "cidade"
                widget: "string"
                required: false
                hint: "Ex.: Itu, Cotia, Porto Feliz, Barueri."

              - label: "Bairro (para integração com portais)"
                name: "bairro"
                widget: "string"
                required: false
                hint: "Informe o bairro real do imóvel. Não utilize apenas o nome do condomínio."

              - label: "Bairro / Condomínio / Região"
                name: "regiao"
                widget: "string"
                required: false
                hint: "Para o filtro do site, comece com Condomínio ou Bairro. Ex.: Condomínio Terras de São José II; Bairro Jardim Europa. O campo Bairro (para integração com portais) permanece independente."

              - label: "Condomínio"
                name: "condominio"
                widget: "string"
                required: false
                hint: "Opcional. Use quando quiser informar separadamente o condomínio."


              # -------------------------------------------------
              # ORGANIZAÇÃO INTERNA — não renderizar na página pública
              # Atenção: estes dados permanecem no JSON público do site.
              # -------------------------------------------------

              - label: "Endereço completo — uso interno"
                name: "endereco_interno"
                widget: "string"
                required: false
                hint: "Para organização interna. Não será exibido nos anúncios, mas estará no JSON público; não inclua dados sigilosos."

              - label: "Observações — uso interno"
                name: "observacoes_internas"
                widget: "text"
                required: false
                hint: "Notas de organização da equipe. Não serão exibidas nos anúncios, mas estarão no JSON público; não inclua dados sigilosos."

              # -------------------------------------------------
              # TIPO E VALORES
              # -------------------------------------------------

              - label: "Tipo"
                name: "tipo"
                widget: "string"
                required: false
                hint: "Ex.: Casa, Apartamento, Terreno, Fazenda."

              - label: "Preço numérico"
                name: "preco"
                widget: "number"
                required: false
                value_type: "float"

              - label: "Valor de venda (R$)"
                name: "precoVenda"
                widget: "number"
                value_type: "float"
                required: false
                hint: "Para anúncio de venda ou venda e locação. Informe somente números, sem R$."

              - label: "Locação mensal — VALOR EXIBIDO (R$)"
                name: "precoLocacaoTexto"
                widget: "string"
                required: false
                hint: "Digite exatamente como deseja ver no site: R$ 18.500,00. Este valor também será usado no filtro de locação e na integração XML. Se deixar vazio, será usado o valor numérico antigo."

              - label: "Locação — valor numérico antigo (opcional)"
                name: "precoLocacao"
                widget: "number"
                value_type: "float"
                required: false
                hint: "Campo mantido para cadastros anteriores. Para novos anúncios ou alterações, preencha preferencialmente o campo 'Locação mensal — VALOR EXIBIDO'."

              - label: "Preço exibido"
                name: "precoTexto"
                widget: "string"
                required: false
                hint: "Ex.: R$ 4.500.000 ou Consulte"

              - label: "Valor do condomínio"
                name: "valorCondominio"
                widget: "string"
                required: false

              - label: "IPTU"
                name: "iptu"
                widget: "string"
                required: false


              # -------------------------------------------------
              # FICHA TÉCNICA
              # -------------------------------------------------

              - label: "Quartos"
                name: "quartos"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Suítes"
                name: "suites"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Banheiros"
                name: "banheiros"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Vagas"
                name: "vagas"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Área construída (m²)"
                name: "areaConstruida"
                widget: "number"
                required: false
                value_type: "float"

              - label: "Área do terreno (m²)"
                name: "areaTerreno"
                widget: "number"
                required: false
                value_type: "float"

              - label: "Ano da construção"
                name: "anoConstrucao"
                widget: "number"
                required: false
                value_type: "int"


              # -------------------------------------------------
              # FOTOS
              # -------------------------------------------------

              - label: "Imagem de capa"
                name: "imagemCapa"
                widget: "image"
                required: false
                hint: "Escolha a principal foto do imóvel."

              - label: "Galeria de fotos"
                name: "galeria"
                widget: "image"
                multiple: true
                required: false
                hint: "Selecione várias fotos de uma vez para montar a galeria."


              # -------------------------------------------------
              # VÍDEOS — upload direto do computador (publicação no GitHub)
              # -------------------------------------------------

              - label: "Vídeos do imóvel"
                name: "videos"
                widget: "list"
                required: false
                summary: "{{fields.titulo}}"
                hint: "Adicione um vídeo por item, diretamente do computador. Prefira MP4 (H.264), arquivos curtos e compactados, até 20 MB por vídeo. O GitHub não aceita arquivos com 100 MB ou mais."
                fields:
                  - label: "Título do vídeo"
                    name: "titulo"
                    widget: "string"
                    required: false
                  - label: "Enviar vídeo do computador"
                    name: "arquivo"
                    widget: "file"
                    required: true
                    media_folder: "/uploads/videos"
                    public_folder: "/uploads/videos"
                    media_library:
                      config:
                        multiple: false

              # -------------------------------------------------
              # DESCRIÇÕES
              # -------------------------------------------------

              - label: "Descrição curta"
                name: "descricao"
                widget: "text"
                required: false
                hint: "Resumo exibido nos cards e apresentações rápidas."

              - label: "Descrição completa"
                name: "descricaoLonga"
                widget: "text"
                required: false
                hint: "Texto completo exibido na página individual da propriedade."


              # -------------------------------------------------
              # CARACTERÍSTICAS PRINCIPAIS
              # -------------------------------------------------

              - label: "Piscina"
                name: "piscina"
                widget: "boolean"
                default: false
                required: false

              - label: "Mobiliado"
                name: "mobiliado"
                widget: "boolean"
                default: false
                required: false

              - label: "Escritório"
                name: "escritorio"
                widget: "boolean"
                default: false
                required: false

              - label: "Área gourmet"
                name: "areaGourmet"
                widget: "boolean"
                default: false
                required: false


              # -------------------------------------------------
              # ACABAMENTOS
              # -------------------------------------------------

              - label: "Acabamentos"
                name: "acabamentos"
                widget: "list"
                required: false
                label_singular: "Acabamento"
                hint: "Ex.: Mármore, madeira natural, porcelanato, esquadrias especiais."

                field:
                  label: "Acabamento"
                  name: "item"
                  widget: "string"


              # -------------------------------------------------
              # AMBIENTES
              # -------------------------------------------------

              - label: "Ambientes & Interior"
                name: "ambientesInterior"
                widget: "list"
                required: false
                label_singular: "Ambiente / característica"
                hint: "Ex.: Escritório, adega, lareira, home cinema, closet."

                field:
                  label: "Item"
                  name: "item"
                  widget: "string"


              # -------------------------------------------------
              # LAZER
              # -------------------------------------------------

              - label: "Áreas Externas & Lazer"
                name: "areasExternasLazer"
                widget: "list"
                required: false
                label_singular: "Item de lazer"
                hint: "Ex.: Piscina, sauna, spa, jardim, quadra, churrasqueira."

                field:
                  label: "Item"
                  name: "item"
                  widget: "string"


              # -------------------------------------------------
              # TECNOLOGIA E CONFORTO
              # -------------------------------------------------

              - label: "Tecnologia, Segurança & Conforto"
                name: "tecnologiaConforto"
                widget: "list"
                required: false
                label_singular: "Item"
                hint: "Ex.: Automação, energia solar, ar-condicionado, CFTV, gerador."

                field:
                  label: "Item"
                  name: "item"
                  widget: "string"


              # -------------------------------------------------
              # MOBÍLIA
              # -------------------------------------------------

              - label: "Mobília & Eletros"
                name: "mobiliaEletros"
                widget: "list"
                required: false
                label_singular: "Item"
                hint: "Ex.: Mobiliado, marcenaria planejada, eletrodomésticos inclusos."

                field:
                  label: "Item"
                  name: "item"
                  widget: "string"


              # -------------------------------------------------
              # DIFERENCIAIS
              # -------------------------------------------------

              - label: "Destaques Piemonte"
                name: "diferenciais"
                widget: "list"
                required: false
                label_singular: "Destaque"
                hint: "Características especiais que merecem destaque nesta propriedade."

                field:
                  label: "Destaque"
                  name: "item"
                  widget: "string"


              # -------------------------------------------------
              # DESTAQUE NA HOME
              # -------------------------------------------------

              - label: "Exibir na Seleção Piemonte"
                name: "destaque"
                widget: "boolean"
                default: false
                required: false
                hint: "Ative para exibir este item na Seleção Piemonte da página inicial."

              - label: "Ordem na Seleção Piemonte"
                name: "ordemDestaque"
                widget: "number"
                default: 99
                required: false
                value_type: "int"
                min: 1
                hint: "Use 1 para aparecer primeiro, 2 para aparecer em segundo e assim por diante."
