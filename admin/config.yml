backend:
  name: github
  repo: trustcorretoraseg-blip/piemonte-brokers-site
  branch: main

locale: "pt"

media_folder: "uploads"
public_folder: "/uploads"

collections:

  - name: "site"
    label: "Configurações do site"
    files:

      - name: "configuracoes"
        label: "Configurações gerais"
        file: "data/site.json"
        format: "json"

        fields:

          - label: "Nome da empresa"
            name: "nome"
            widget: "string"

          - label: "Título da Home"
            name: "tituloHome"
            widget: "string"

          - label: "Subtítulo da Home"
            name: "subtituloHome"
            widget: "text"

          - label: "Imagem principal da Home"
            name: "imagemHome"
            widget: "image"

          - label: "Texto Sobre"
            name: "textoSobre"
            widget: "text"

          - label: "WhatsApp"
            name: "whatsapp"
            widget: "string"
            required: false

          - label: "E-mail"
            name: "email"
            widget: "string"
            required: false

          - label: "Instagram"
            name: "instagram"
            widget: "string"
            required: false

          - label: "Cidade base"
            name: "cidadeBase"
            widget: "string"
            required: false

          - label: "CRECI da empresa"
            name: "creciEmpresa"
            widget: "string"
            required: false


  - name: "regioes"
    label: "Regiões"
    files:

      - name: "regioes"
        label: "Regiões de atuação"
        file: "data/regioes.json"
        format: "json"

        fields:

          - label: "Regiões"
            name: "itens"
            widget: "list"
            summary: "{{fields.nome}}"

            fields:

              - label: "ID"
                name: "id"
                widget: "string"

              - label: "Nome"
                name: "nome"
                widget: "string"

              - label: "Descrição"
                name: "descricao"
                widget: "text"
                required: false

              - label: "Imagem"
                name: "imagem"
                widget: "image"
                required: false

              - label: "Cidade usada no filtro"
                name: "cidadeFiltro"
                widget: "string"
                required: false

              - label: "Exibir na Home"
                name: "destaque"
                widget: "boolean"
                default: true
                required: false


  - name: "portfolio"
    label: "Portfólio"
    files:

      - name: "portfolio"
        label: "Imóveis e Áreas"
        file: "data/portfolio.json"
        format: "json"

        fields:

          - label: "Itens"
            name: "itens"
            widget: "list"
            summary: "{{fields.titulo}}"

            fields:

              - label: "ID"
                name: "id"
                widget: "string"
                hint: "Use um identificador único, sem repetir em outro imóvel."

              - label: "Categoria"
                name: "categoria"
                widget: "select"
                options:
                  - "Imóvel"
                  - "Área"

              - label: "Status"
                name: "status"
                widget: "select"
                default: "Disponível"
                options:
                  - "Disponível"
                  - "Reservado"
                  - "Vendido"
                  - "Indisponível"

              - label: "Negócio"
                name: "negocio"
                widget: "select"
                required: false
                options:
                  - "Venda"
                  - "Locação"

              - label: "Título"
                name: "titulo"
                widget: "string"

              - label: "Região principal"
                name: "regiaoPrincipal"
                widget: "select"
                required: false
                options:
                  - "Itu e Região"
                  - "Porto Feliz e Região"
                  - "Granja Viana"
                  - "Alphaville"
                  - "São Paulo"
                  - "Sorocaba"
                  - "Indaiatuba"
                  - "Outras Regiões"

              - label: "Cidade"
                name: "cidade"
                widget: "string"
                required: false

              - label: "Bairro / Condomínio / Região"
                name: "regiao"
                widget: "string"
                required: false

              - label: "Nome do condomínio"
                name: "condominio"
                widget: "string"
                required: false

              - label: "Tipo"
                name: "tipo"
                widget: "select"
                required: false
                options:
                  - "Casa"
                  - "Apartamento"
                  - "Cobertura"
                  - "Terreno"
                  - "Área"
                  - "Fazenda"
                  - "Sítio"
                  - "Chácara"
                  - "Comercial"
                  - "Industrial"
                  - "Galpão"
                  - "Prédio"
                  - "Hotel"
                  - "Outro"

              - label: "Preço numérico"
                name: "preco"
                widget: "number"
                required: false
                value_type: "float"
                hint: "Digite apenas números. Ex.: 4500000"

              - label: "Preço exibido"
                name: "precoTexto"
                widget: "string"
                required: false
                hint: "Ex.: R$ 4.500.000 ou Consulte"

              - label: "Dormitórios"
                name: "quartos"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Suítes"
                name: "suites"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Banheiros"
                name: "banheiros"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Vagas"
                name: "vagas"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Área construída (m²)"
                name: "areaConstruida"
                widget: "number"
                required: false
                value_type: "float"

              - label: "Área do terreno (m²)"
                name: "areaTerreno"
                widget: "number"
                required: false
                value_type: "float"

              - label: "Valor do condomínio"
                name: "valorCondominio"
                widget: "string"
                required: false
                hint: "Ex.: R$ 1.200/mês"

              - label: "IPTU"
                name: "iptu"
                widget: "string"
                required: false
                hint: "Ex.: R$ 8.500/ano"

              - label: "Ano de construção"
                name: "anoConstrucao"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Imagem de capa"
                name: "imagemCapa"
                widget: "image"
                required: false
                hint: "Essa será a principal foto exibida nos cards."

              - label: "Galeria de fotos"
                name: "galeria"
                widget: "image"
                multiple: true
                required: false
                hint: "Você pode selecionar várias fotos de uma só vez."

              - label: "Descrição curta"
                name: "descricao"
                widget: "text"
                required: false
                hint: "Texto resumido para cards e chamadas."

              - label: "Descrição completa"
                name: "descricaoLonga"
                widget: "text"
                required: false
                hint: "Texto detalhado que aparecerá na página individual da propriedade."

              - label: "Piscina"
                name: "piscina"
                widget: "boolean"
                default: false
                required: false

              - label: "Mobiliado"
                name: "mobiliado"
                widget: "boolean"
                default: false
                required: false

              - label: "Escritório"
                name: "escritorio"
                widget: "boolean"
                default: false
                required: false

              - label: "Área gourmet"
                name: "areaGourmet"
                widget: "boolean"
                default: false
                required: false

              - label: "Diferenciais"
                name: "diferenciais"
                widget: "list"
                required: false
                hint: "Adicione os principais diferenciais da propriedade."
                field:
                  label: "Diferencial"
                  name: "texto"
                  widget: "string"

              - label: "Exibir na Seleção Piemonte"
                name: "destaque"
                widget: "boolean"
                default: false
                required: false
                hint: "Ative para exibir este item na Seleção Piemonte da página inicial."

              - label: "Ordem na Seleção Piemonte"
                name: "ordemDestaque"
                widget: "number"
                default: 99
                required: false
                value_type: "int"
                min: 1
                hint: "Use 1 para aparecer primeiro, 2 para aparecer em segundo e assim por diante."