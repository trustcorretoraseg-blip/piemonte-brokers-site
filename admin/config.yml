# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: trustcorretoraseg-blip/piemonte-brokers-site
  branch: main

media_folder: "uploads"
public_folder: "/uploads"
locale: "pt"

collections:

  # =========================================================
  # CONFIGURAÇÕES DO SITE
  # =========================================================

  - name: "configuracoes"
    label: "Configurações do Site"

    files:

      - name: "site"
        label: "Dados gerais"
        file: "data/site.json"
        format: "json"

        fields:

          - label: "Nome da empresa"
            name: "nome"
            widget: "string"

          - label: "Título da Home"
            name: "tituloHome"
            widget: "string"

          - label: "Subtítulo da Home"
            name: "subtituloHome"
            widget: "text"

          - label: "Imagem principal da Home"
            name: "imagemHome"
            widget: "image"

          - label: "Texto Sobre"
            name: "textoSobre"
            widget: "text"

          - label: "WhatsApp"
            name: "whatsapp"
            widget: "string"
            required: false
            hint: "Somente números, com DDI. Ex.: 5511999999999"

          - label: "E-mail"
            name: "email"
            widget: "string"
            required: false

          - label: "Instagram"
            name: "instagram"
            widget: "string"
            required: false

          - label: "Cidade base"
            name: "cidadeBase"
            widget: "string"
            required: false

          - label: "CRECI empresa"
            name: "creciEmpresa"
            widget: "string"
            required: false


  # =========================================================
  # REGIÕES INSTITUCIONAIS
  # =========================================================

  - name: "regioes"
    label: "Regiões"

    files:

      - name: "regioes"
        label: "Fotos e informações das regiões"
        file: "data/regioes.json"
        format: "json"

        fields:

          - label: "Regiões"
            name: "itens"
            widget: "list"
            summary: "{{fields.nome}}"

            fields:

              - label: "ID interno"
                name: "id"
                widget: "string"
                hint: "Ex.: itu, porto-feliz, alphaville"

              - label: "Nome da região"
                name: "nome"
                widget: "string"

              - label: "Descrição"
                name: "descricao"
                widget: "text"

              - label: "Foto da região"
                name: "imagem"
                widget: "image"

              - label: "Cidade usada no filtro"
                name: "cidadeFiltro"
                widget: "string"
                required: false

              - label: "Mostrar na Home"
                name: "destaque"
                widget: "boolean"
                default: true


  # =========================================================
  # PORTFÓLIO
  # =========================================================

  - name: "portfolio"
    label: "Portfólio"

    files:

      - name: "portfolio"
        label: "Imóveis e Áreas"
        file: "data/portfolio.json"
        format: "json"

        fields:

          - label: "Oportunidades"
            name: "itens"
            widget: "list"
            summary: "{{fields.titulo}} — {{fields.regiaoPrincipal}}"

            fields:

              # =================================================
              # 1. IDENTIFICAÇÃO
              # =================================================

              - label: "ID interno"
                name: "id"
                widget: "string"
                hint: "Ex.: casa-terras-sao-jose-itu"

              - label: "Categoria"
                name: "categoria"
                widget: "select"
                options:
                  - "Imóvel"
                  - "Área"
                default: "Imóvel"

              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - "Disponível"
                  - "Reservado"
                  - "Em negociação"
                  - "Vendido"
                  - "Indisponível"
                default: "Disponível"

              - label: "Negócio"
                name: "negocio"
                widget: "select"
                options:
                  - "Venda"
                  - "Locação"
                  - "Parceria"
                  - "Permuta"
                default: "Venda"

              - label: "Título do anúncio"
                name: "titulo"
                widget: "string"
                hint: "Ex.: Residência contemporânea no Terras de São José"


              # =================================================
              # 2. ORGANIZAÇÃO / REGIÃO
              # =================================================

              - label: "Região principal"
                name: "regiaoPrincipal"
                widget: "select"
                options:
                  - "Itu"
                  - "Porto Feliz"
                  - "Indaiatuba"
                  - "Alphaville"
                  - "Granja Viana"
                  - "Sorocaba"
                  - "Avaré"
                  - "São Paulo"
                  - "Outras regiões"
                hint: "Escolha onde esta oportunidade deve ficar organizada."

              - label: "Cidade"
                name: "cidade"
                widget: "string"
                required: false
                hint: "Ex.: Itu, Cotia, Santana de Parnaíba"

              - label: "Bairro / Condomínio / Localização"
                name: "regiao"
                widget: "string"
                required: false
                hint: "Ex.: Terras de São José I, Fazenda da Grama, Alphaville 1"


              # =================================================
              # 3. TIPO DO ATIVO
              # =================================================

              - label: "Tipo do ativo"
                name: "tipo"
                widget: "select"
                options:
                  - "Casa"
                  - "Apartamento"
                  - "Terreno residencial"
                  - "Sala comercial"
                  - "Prédio comercial"
                  - "Galpão"
                  - "Hotel / Pousada"
                  - "Fazenda / Sítio"
                  - "Área residencial"
                  - "Área comercial"
                  - "Área industrial"
                  - "Área para incorporação"
                  - "Área para loteamento"
                  - "Área rural"
                  - "Gleba"
                  - "Empreendimento"
                  - "Outro"
                hint: "Para Categoria Imóvel, escolha um tipo de imóvel. Para Categoria Área, escolha um tipo de área."


              # =================================================
              # 4. VALORES
              # =================================================

              - label: "Preço numérico"
                name: "preco"
                widget: "number"
                required: false
                hint: "Digite somente números. Ex.: 14500000"

              - label: "Preço exibido no site"
                name: "precoTexto"
                widget: "string"
                required: false
                hint: "Ex.: R$ 14.500.000 ou Valor sob consulta"


              # =================================================
              # 5. CARACTERÍSTICAS
              # =================================================

              - label: "Dormitórios"
                name: "quartos"
                widget: "number"
                required: false
                default: 0
                hint: "Para áreas, pode deixar 0."

              - label: "Suítes"
                name: "suites"
                widget: "number"
                required: false
                default: 0
                hint: "Para áreas, pode deixar 0."

              - label: "Banheiros"
                name: "banheiros"
                widget: "number"
                required: false
                default: 0
                hint: "Para áreas, pode deixar 0."

              - label: "Vagas"
                name: "vagas"
                widget: "number"
                required: false
                default: 0
                hint: "Para áreas, pode deixar 0."

              - label: "Área construída (m²)"
                name: "areaConstruida"
                widget: "number"
                required: false
                default: 0

              - label: "Área do terreno / total (m²)"
                name: "areaTerreno"
                widget: "number"
                required: false
                default: 0


              # =================================================
              # 6. FOTOS
              # =================================================

              - label: "Foto de capa"
                name: "imagemCapa"
                widget: "image"
                hint: "Imagem principal do anúncio."

              - label: "Galeria de fotos"
                name: "galeria"
                widget: "list"
                required: false
                field:
                  label: "Foto"
                  name: "foto"
                  widget: "image"


              # =================================================
              # 7. APRESENTAÇÃO
              # =================================================

              - label: "Descrição"
                name: "descricao"
                widget: "text"

              - label: "Destaque na Home"
                name: "destaque"
                widget: "boolean"
                default: false
                hint: "Ative para esta oportunidade poder aparecer entre os destaques da Home."