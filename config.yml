backend:
  name: git-gateway
  branch: main

publish_mode: simple
media_folder: "public/uploads"
public_folder: "/uploads"

locale: "pt"

collections:
  - name: "configuracoes"
    label: "Configurações do Site"
    files:
      - name: "site"
        label: "Dados gerais"
        file: "src/_data/site.json"
        format: "json"
        fields:
          - { label: "Nome da empresa", name: "nome", widget: "string" }
          - { label: "Título da Home", name: "tituloHome", widget: "string" }
          - { label: "Subtítulo da Home", name: "subtituloHome", widget: "text" }
          - { label: "Imagem principal da Home", name: "imagemHome", widget: "image" }
          - { label: "WhatsApp (somente números, com DDI)", name: "whatsapp", widget: "string", required: false }
          - { label: "E-mail", name: "email", widget: "string", required: false }
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Cidade base", name: "cidadeBase", widget: "string", required: false }
          - { label: "Texto Sobre", name: "textoSobre", widget: "text" }
          - { label: "CRECI empresa", name: "creciEmpresa", widget: "string", required: false }

  - name: "imoveis"
    label: "Imóveis"
    label_singular: "Imóvel"
    folder: "src/imoveis"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "detalhe.njk" }
      - { label: "Categoria", name: "tipoConteudo", widget: "hidden", default: "imovel" }
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "Ex.: casa-fazenda-da-grama" }
      - { label: "Status", name: "status", widget: "select", options: ["Disponível", "Reservado", "Vendido", "Indisponível"], default: "Disponível" }
      - { label: "Negócio", name: "negocio", widget: "select", options: ["Venda", "Locação"] }
      - { label: "Tipo", name: "tipo", widget: "select", options: ["Casa", "Apartamento", "Terreno", "Sítio", "Fazenda", "Comercial", "Outro"] }
      - { label: "Cidade", name: "cidade", widget: "string" }
      - { label: "Bairro / Condomínio", name: "regiao", widget: "string", required: false }
      - { label: "Preço numérico", name: "preco", widget: "number", value_type: "int", required: false }
      - { label: "Preço exibido", name: "precoTexto", widget: "string", required: false, hint: "Ex.: R$ 4.500.000 ou Sob consulta" }
      - { label: "Dormitórios", name: "quartos", widget: "number", value_type: "int", required: false }
      - { label: "Suítes", name: "suites", widget: "number", value_type: "int", required: false }
      - { label: "Banheiros", name: "banheiros", widget: "number", value_type: "int", required: false }
      - { label: "Vagas", name: "vagas", widget: "number", value_type: "int", required: false }
      - { label: "Área construída (m²)", name: "areaConstruida", widget: "number", required: false }
      - { label: "Área do terreno (m²)", name: "areaTerreno", widget: "number", required: false }
      - { label: "Destaque", name: "destaque", widget: "boolean", default: false }
      - { label: "Foto de capa", name: "imagemCapa", widget: "image" }
      - label: "Galeria"
        name: "galeria"
        widget: "list"
        required: false
        field: { label: "Foto", name: "imagem", widget: "image" }
      - { label: "Descrição", name: "body", widget: "markdown" }

  - name: "areas"
    label: "Áreas e Oportunidades"
    label_singular: "Área"
    folder: "src/areas"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "detalhe.njk" }
      - { label: "Categoria", name: "tipoConteudo", widget: "hidden", default: "area" }
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "Ex.: area-sorocaba-loteamento" }
      - { label: "Status", name: "status", widget: "select", options: ["Disponível", "Em negociação", "Vendido", "Indisponível"], default: "Disponível" }
      - { label: "Negócio", name: "negocio", widget: "select", options: ["Venda", "Parceria", "Permuta", "Locação"] }
      - { label: "Tipo", name: "tipo", widget: "select", options: ["Área para desenvolvimento", "Loteamento", "Fazenda", "Sítio", "Terreno", "Comercial", "Outro"] }
      - { label: "Cidade", name: "cidade", widget: "string" }
      - { label: "Região", name: "regiao", widget: "string", required: false }
      - { label: "Preço numérico", name: "preco", widget: "number", required: false }
      - { label: "Preço exibido", name: "precoTexto", widget: "string", required: false }
      - { label: "Área total (m²)", name: "areaTerreno", widget: "number", required: false }
      - { label: "Destaque", name: "destaque", widget: "boolean", default: false }
      - { label: "Foto de capa", name: "imagemCapa", widget: "image" }
      - label: "Galeria"
        name: "galeria"
        widget: "list"
        required: false
        field: { label: "Foto", name: "imagem", widget: "image" }
      - { label: "Descrição", name: "body", widget: "markdown" }
