<form
  name="parceria"
  method="POST"
  action="/obrigado.html"
  data-netlify="true"
  netlify-honeypot="bot-field"
>

  <input
    type="hidden"
    name="form-name"
    value="parceria"
  >

  <p style="display:none;">
    <label>
      Não preencha este campo:
      <input name="bot-field">
    </label>
  </p>

  <div class="form-grid">

    <div>
      <label for="nome-parceria">Nome</label>
      <input
        id="nome-parceria"
        type="text"
        name="nome"
        placeholder="Seu nome"
        required
      >
    </div>

    <div>
      <label for="telefone-parceria">Telefone / WhatsApp</label>
      <input
        id="telefone-parceria"
        type="tel"
        name="telefone"
        placeholder="(11) 99999-9999"
        required
      >
    </div>

    <div>
      <label for="email-parceria">E-mail</label>
      <input
        id="email-parceria"
        type="email"
        name="email"
        placeholder="seuemail@exemplo.com"
        required
      >
    </div>

    <div>
      <label for="empresa-parceria">Empresa</label>
      <input
        id="empresa-parceria"
        type="text"
        name="empresa"
        placeholder="Nome da empresa"
      >
    </div>

  </div>

  <div style="margin-top:18px;">
    <label for="tipo-parceria">Tipo de parceria</label>

    <select
      id="tipo-parceria"
      name="tipo_parceria"
      required
    >
      <option value="">Selecione</option>
      <option value="Corretor parceiro">Corretor parceiro</option>
      <option value="Imobiliária">Imobiliária</option>
      <option value="Investidor">Investidor</option>
      <option value="Incorporadora">Incorporadora</option>
      <option value="Proprietário">Proprietário</option>
      <option value="Outro">Outro</option>
    </select>
  </div>

  <div style="margin-top:18px;">
    <label for="mensagem-parceria">
      Conte-nos sobre a oportunidade ou proposta de parceria
    </label>

    <textarea
      id="mensagem-parceria"
      name="mensagem"
      rows="6"
      placeholder="Descreva brevemente a oportunidade, imóvel, área, cliente ou proposta de parceria."
      required
    ></textarea>
  </div>

  <button
    type="submit"
    class="btn gold"
    style="margin-top:20px;"
  >
    Enviar proposta de parceria
  </button>

  <p
    style="
      margin-top:14px;
      font-size:12px;
      opacity:.7;
      line-height:1.5;
    "
  >
    Ao enviar, você autoriza a Piemonte Brokers
    a entrar em contato para avaliar a proposta
    e dar continuidade à conversa.
  </p>

</form>
